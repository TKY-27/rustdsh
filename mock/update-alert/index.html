<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mock: rdsh update alert</title>
<style>
:root {
  color-scheme: dark;
  --dsw-alias-bg-app: #0d1117;
  --dsw-alias-bg-raised: #161b22;
  --dsw-alias-border-default: #30363d;
  --dsw-alias-text-primary: #e6edf3;
  --dsw-alias-text-secondary: #8b949e;
  --dsw-alias-state-success: #3fb950;
  --dsw-alias-state-business-primary: #4176e6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--dsw-alias-bg-app); color: var(--dsw-alias-text-primary);
  font: 14px/1.6 system-ui, "Hiragino Sans", sans-serif; min-height: 100vh; }
.appbar { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  border-bottom: 1px solid var(--dsw-alias-border-default); color: var(--dsw-alias-text-secondary); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dsw-alias-state-success);
  box-shadow: 0 0 8px var(--dsw-alias-state-success); }
.chat { max-width: 720px; margin: 32px auto; padding: 0 16px; color: var(--dsw-alias-text-secondary); }
.bubble { background: var(--dsw-alias-bg-raised); border: 1px solid var(--dsw-alias-border-default);
  border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
/* ---- update alert banner ---- */
#update-alert { position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  z-index: 50; display: flex; align-items: center; gap: 12px; max-width: min(640px, calc(100vw - 32px));
  background: var(--dsw-alias-bg-raised); border: 1px solid var(--dsw-alias-state-success);
  border-radius: 12px; padding: 10px 12px 10px 14px;
  box-shadow: 0 8px 32px rgba(63, 185, 80, 0.25); }
#update-alert.show { animation: drop-in 0.35s ease-out, shake 0.5s ease-in-out 0.35s; }
#update-alert.nudge { animation: shake 0.5s ease-in-out; }
@keyframes drop-in { from { top: -80px; opacity: 0; } to { top: 12px; opacity: 1; } }
@keyframes shake {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  15% { transform: translateX(calc(-50% - 9px)) rotate(-1.2deg); }
  30% { transform: translateX(calc(-50% + 8px)) rotate(1deg); }
  45% { transform: translateX(calc(-50% - 6px)) rotate(-0.8deg); }
  60% { transform: translateX(calc(-50% + 5px)) rotate(0.6deg); }
  75% { transform: translateX(calc(-50% - 3px)) rotate(-0.3deg); }
  90% { transform: translateX(calc(-50% + 2px)) rotate(0.1deg); }
}
.bell { font-size: 22px; display: inline-block; }
.show .bell { animation: bell-wiggle 0.6s ease-in-out 0.4s; transform-origin: top center; }
@keyframes bell-wiggle {
  0%, 100% { transform: rotate(0); } 20% { transform: rotate(18deg); }
  40% { transform: rotate(-14deg); } 60% { transform: rotate(9deg); } 80% { transform: rotate(-5deg); }
}
.msg { font-size: 13px; }
.msg b { font-size: 14px; }
.ver { display: inline-block; font: 12px monospace; background: var(--dsw-alias-bg-app);
  border: 1px solid var(--dsw-alias-border-default); border-radius: 6px; padding: 0 6px; margin: 0 2px; }
.actions { display: flex; gap: 8px; margin-left: 4px; white-space: nowrap; }
button { font-size: 12px; border-radius: 7px; padding: 6px 12px; cursor: pointer; }
.primary { background: var(--dsw-alias-state-success); color: #fff; border: 0; }
.ghost { background: transparent; color: var(--dsw-alias-text-primary);
  border: 1px solid var(--dsw-alias-border-default); }
.close { background: transparent; border: 0; color: var(--dsw-alias-text-secondary);
  font-size: 16px; padding: 4px 8px; }
.demo { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="appbar"><span class="dot"></span> dsh web（mock背景）</div>
<div id="update-alert" class="hidden" role="alert">
  <span class="bell">🔔</span>
  <div class="msg"><b>rdsh が更新したよ！</b><br>
    <span style="white-space:nowrap"><span class="ver">0.2.0-rc.2</span> → <span class="ver">0.2.1-rc.1</span></span><br>
    <span style="color:var(--dsw-alias-text-secondary)">再起動で適用されます</span>
  </div>
  <div class="actions">
    <button class="primary" onclick="ack()">今すぐ再起動</button>
    <button class="ghost" onclick="later()">あとで</button>
    <button class="close" onclick="dismiss()" aria-label="閉じる">×</button>
  </div>
</div>
<div class="chat">
  <div class="bubble">（会話プレースホルダ）アラートはこの上に重なって出ます</div>
  <div class="bubble">震える演出＝出現時の shake＋ベルの wiggle です</div>
</div>
<div class="demo">
  <button class="ghost" onclick="show()">アラート表示</button>
  <button class="ghost" onclick="nudge()">もう一度震わす</button>
</div>
<script>
const el = document.getElementById("update-alert");
function show() {
  el.classList.remove("hidden");
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
}
function nudge() {
  el.classList.remove("hidden");
  el.classList.remove("nudge");
  void el.offsetWidth;
  el.classList.add("nudge");
}
function dismiss() { el.classList.add("hidden"); }
function later() { dismiss(); }
function ack() { dismiss(); }
show();
</script>
</body>
</html>
